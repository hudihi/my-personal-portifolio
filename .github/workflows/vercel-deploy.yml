name: Vercel Deploy

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ENVIRONMENT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"

      - name: Build production deployment
        if: env.VERCEL_ENVIRONMENT == 'production'
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Build preview deployment
        if: env.VERCEL_ENVIRONMENT == 'preview'
        run: npx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: env.VERCEL_ENVIRONMENT == 'production'
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: env.VERCEL_ENVIRONMENT == 'preview'
        run: npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"
